<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QR Code Scanner</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .scan-overlay {
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.65);
        }
        .scan-line {
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white h-screen w-full overflow-hidden flex flex-col">
<!-- Main Scanner Container -->
<div class="relative flex-1 w-full flex flex-col overflow-hidden bg-black group/design-root">
<!-- Simulated Camera Feed -->
<div class="absolute inset-0 w-full h-full z-0">
<img class="w-full h-full object-cover opacity-80" data-alt="Blurred background view of a modern concrete parking structure" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCq7fZ_WpxqQr31ybEfspwghOlYhKAl4SJ96ddXcZYkRrCZ_WOYsOtx08g6jNcqdqgr57B23zVpxh3jS7X40JNPCEmss5uN7I5oMnXgDLYtxrJSOXHUw9CPRf6kSfKK9l5BLeeTE7yDoHptqWeoyHqZGjYQ8xdHBr6lJ4UMFQ-KWJkmNkhzYCcJAbgZk2VcvtrsYDGzmr5SQglHi8GHTMSMURsm1DYqPohwShIr5xoPffnvcePGqAUdVACNMTIWRMXzasdzEekzUN0"/>
</div>
<!-- Scanner UI Overlay Layer -->
<div class="absolute inset-0 z-10 flex flex-col w-full h-full">
<!-- Top App Bar (Transparent Overlay) -->
<div class="flex items-center p-4 pt-12 pb-2 justify-between z-20">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full bg-black/20 backdrop-blur-sm text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10 shadow-black drop-shadow-md">Scanner</h2>
</div>
<!-- Central Scanning Area -->
<div class="flex-1 flex flex-col items-center justify-center relative w-full">
<!-- Headline Text (Instructions) -->
<div class="absolute top-[15%] w-full z-30">
<h3 class="text-white tracking-wide text-lg font-semibold leading-tight px-6 text-center drop-shadow-lg">
                        Scannez le QR code du client
                    </h3>
</div>
<!-- The Scanning Box with Shadow Overlay -->
<!-- The box-shadow on this div creates the dark overlay for the rest of the screen -->
<div class="relative w-72 h-72 rounded-3xl scan-overlay ring-1 ring-white/10 z-20">
<!-- Reticle Corners -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-[5px] border-l-[5px] border-primary rounded-tl-2xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-[5px] border-r-[5px] border-primary rounded-tr-2xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-[5px] border-l-[5px] border-primary rounded-bl-2xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-[5px] border-r-[5px] border-primary rounded-br-2xl"></div>
<!-- Animating Scan Line -->
<div class="absolute left-4 right-4 h-0.5 bg-primary/70 shadow-[0_0_15px_rgba(19,236,19,0.8)] scan-line rounded-full"></div>
</div>
<!-- Flashlight Control (Floating below scan area) -->
<div class="absolute bottom-[15%] w-full flex justify-center z-30">
<button class="flex items-center justify-center rounded-full size-14 bg-black/40 backdrop-blur-md border border-white/10 text-white hover:bg-white/10 transition-all active:scale-95 group">
<span class="material-symbols-outlined text-[28px] group-hover:text-primary transition-colors">flash_on</span>
</button>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full pb-6 px-4 z-30 flex justify-center bg-gradient-to-t from-black/80 to-transparent pt-10">
<button class="flex min-w-[140px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-6 bg-white/90 backdrop-blur text-background-dark text-sm font-bold leading-normal tracking-[0.015em] shadow-lg active:bg-white transition-colors gap-2">
<span class="material-symbols-outlined text-[20px]">keyboard</span>
<span class="truncate">Enter code manually</span>
</button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar -->
<div class="h-20 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-white/5 flex justify-around items-center px-2 pb-2 shrink-0 z-40">
<!-- Home Tab -->
<button class="flex flex-col items-center justify-center w-16 h-full gap-1 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
<span class="material-symbols-outlined text-[26px]">garage_home</span>
<span class="text-[10px] font-medium">Home</span>
</button>
<!-- Scanner Tab (Active) -->
<div class="relative -top-6">
<button class="flex items-center justify-center size-14 rounded-full bg-primary text-background-dark shadow-lg shadow-primary/40 ring-4 ring-background-light dark:ring-background-dark transition-transform active:scale-95">
<span class="material-symbols-outlined text-[28px]">qr_code_scanner</span>
</button>
</div>
<!-- Profile Tab -->
<button class="flex flex-col items-center justify-center w-16 h-full gap-1 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
<span class="material-symbols-outlined text-[26px]">person</span>
<span class="text-[10px] font-medium">Profile</span>
</button>
</div>
</body></html>
