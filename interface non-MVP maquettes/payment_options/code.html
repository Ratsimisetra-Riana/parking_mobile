<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Options</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111811] dark:text-gray-100 flex flex-col h-screen overflow-hidden">
<!-- Top Navigation -->
<header class="flex items-center justify-between px-4 py-3 bg-background-light dark:bg-background-dark sticky top-0 z-20">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#111811] dark:text-white">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold text-[#111811] dark:text-white tracking-tight">Payment Options</h1>
<button class="text-sm font-medium text-primary hover:opacity-80 transition-opacity">
            Save
        </button>
</header>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-24">
<div class="px-4 py-2 w-full max-w-lg mx-auto">
<!-- Segmented Control -->
<div class="flex p-1 mb-8 bg-gray-200 dark:bg-white/10 rounded-xl">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="payment_method" type="radio" value="card"/>
<div class="py-2 px-3 text-center text-sm font-medium rounded-lg text-gray-500 dark:text-gray-400 peer-checked:bg-white dark:peer-checked:bg-gray-700 peer-checked:text-[#111811] dark:peer-checked:text-white peer-checked:shadow-sm transition-all duration-200">
                        Credit Card
                    </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="payment_method" type="radio" value="paypal"/>
<div class="py-2 px-3 text-center text-sm font-medium rounded-lg text-gray-500 dark:text-gray-400 peer-checked:bg-white dark:peer-checked:bg-gray-700 peer-checked:text-[#111811] dark:peer-checked:text-white peer-checked:shadow-sm transition-all duration-200">
                        PayPal
                    </div>
</label>
</div>
<!-- Provider Logos -->
<div class="mb-6">
<p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3 pl-1">Accepted Cards</p>
<div class="flex gap-3">
<div class="h-10 w-14 bg-white dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-700 flex items-center justify-center overflow-hidden relative">
<div class="absolute inset-0 bg-gradient-to-br from-blue-600 to-blue-800 opacity-80" data-alt="Visa Logo Representation"></div>
<span class="relative text-[10px] font-bold text-white font-serif italic z-10">Visa</span>
</div>
<div class="h-10 w-14 bg-white dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-700 flex items-center justify-center overflow-hidden relative">
<div class="absolute inset-0 bg-gradient-to-r from-red-500 to-orange-500 opacity-80" data-alt="Mastercard Logo Representation"></div>
<div class="relative flex z-10">
<div class="w-4 h-4 rounded-full bg-white/40 -mr-2"></div>
<div class="w-4 h-4 rounded-full bg-white/40"></div>
</div>
</div>
<div class="h-10 w-14 bg-white dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-700 flex items-center justify-center overflow-hidden relative">
<div class="absolute inset-0 bg-blue-500 opacity-80" data-alt="Amex Logo Representation"></div>
<span class="relative text-[8px] font-bold text-white z-10 tracking-widest">AMEX</span>
</div>
</div>
</div>
<!-- Card Input Form -->
<form class="space-y-5">
<!-- Cardholder Name -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-[#111811] dark:text-gray-200 ml-1">Cardholder Name</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#111811] dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Card Number -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-[#111811] dark:text-gray-200 ml-1">Card Number</label>
<div class="relative group">
<input class="w-full h-12 pl-11 pr-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#111811] dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow font-mono" placeholder="0000 0000 0000 0000" type="tel"/>
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
</div>
<div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-primary opacity-0 group-focus-within:opacity-100 transition-opacity pointer-events-none">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
</div>
</div>
</div>
<!-- Expiry & CVV -->
<div class="flex gap-4">
<div class="space-y-1.5 flex-1">
<label class="text-sm font-medium text-[#111811] dark:text-gray-200 ml-1">Expiry Date</label>
<input class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#111811] dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow font-mono text-center" placeholder="MM/YY" type="tel"/>
</div>
<div class="space-y-1.5 flex-1">
<div class="flex items-center justify-between ml-1">
<label class="text-sm font-medium text-[#111811] dark:text-gray-200">CVV</label>
<span class="material-symbols-outlined text-gray-400 text-[16px] cursor-help" title="3 digit number on back of card">help</span>
</div>
<input class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#111811] dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow font-mono text-center" placeholder="123" type="tel"/>
</div>
</div>
<!-- Alternative Method Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-background-light dark:bg-background-dark text-gray-500">Or pay with</span>
</div>
</div>
<!-- PayPal Button -->
<button class="w-full flex items-center justify-center gap-3 h-12 bg-[#0070BA]/10 dark:bg-[#0070BA]/20 hover:bg-[#0070BA]/20 dark:hover:bg-[#0070BA]/30 rounded-xl border border-[#0070BA]/20 transition-colors" type="button">
<span class="font-bold text-[#0070BA] dark:text-[#3b9ad6]">PayPal</span>
<span class="text-sm font-medium text-[#0070BA] dark:text-[#3b9ad6]">Lier un compte PayPal</span>
</button>
</form>
</div>
</main>
<!-- Footer Action -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-[#102210]/90 backdrop-blur-md border-t border-gray-100 dark:border-white/5 z-20">
<div class="max-w-lg mx-auto w-full">
<button class="w-full h-14 bg-primary hover:bg-[#11d811] active:scale-[0.98] text-[#0a2e0a] font-bold text-lg rounded-2xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all">
                Ajouter une carte
            </button>
<div class="flex items-center justify-center gap-1.5 mt-3 text-xs text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>Payments secured by Stripe</span>
</div>
</div>
</div>
</body></html>
