<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Dispute</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom utilities for consistent feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111811] dark:text-white antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<div class="sticky top-0 z-50 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 border-b border-gray-100 dark:border-gray-800">
<div class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[#111811] dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</div>
<h2 class="text-[#111811] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Signaler un litige</h2>
</div>
<!-- Main Content -->
<main class="flex-1 flex flex-col gap-6 p-4 pb-24">
<!-- Reservation Context Card -->
<div class="flex flex-col gap-2">
<h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 ml-1">Réservation concernée</h3>
<div class="flex items-stretch justify-between gap-4 rounded-xl bg-white dark:bg-[#1a2e1a] p-3 shadow-sm border border-gray-100 dark:border-gray-800">
<div class="flex flex-col justify-center gap-1 flex-[2_2_0px]">
<p class="text-[#111811] dark:text-white text-base font-bold leading-tight">Parking Gare Montparnasse</p>
<div class="flex items-center gap-1.5 pt-1">
<span class="material-symbols-outlined text-primary text-[18px]">calendar_today</span>
<p class="text-gray-600 dark:text-gray-300 text-sm font-medium leading-normal">12 Oct • 14:00 - 18:00</p>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 text-[18px]">location_on</span>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal leading-normal">Paris, France</p>
</div>
</div>
<div class="w-24 shrink-0 bg-center bg-no-repeat bg-cover rounded-lg aspect-square" data-alt="Map view showing the location of Parking Gare Montparnasse in Paris" data-location="Paris" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDwneRK_QPBkLVKDeO80qxEbZ67U6mN21uthtkcR4E1BQNXG-q-wwezNcV8kWpoA48vOFvUMvYQtZ0vAEyGMXYJuFP_-jnRAT67HQ4QE43NC-8KFq4DpYT4rr5Gm3QIrjweWEHpIqGnlpN0FiO_c_PSkxPLPqrLhm6FtSvLaGcA_ycgX5Byv0whHwWlLw2Ko_HJlKVCwpYbPjWPiKYeqvUpLOOR1quyO4dETXVriLmJjoTmw9ihCpHUq0pQDK4FMIoOIpeAd3IlQw8");'>
</div>
</div>
</div>
<!-- Dispute Type Field -->
<div class="flex flex-col gap-2">
<label class="text-[#111811] dark:text-white text-base font-semibold leading-normal ml-1">Type de litige</label>
<div class="relative">
<select class="appearance-none flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#111811] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a2e1a] h-14 pl-4 pr-12 text-base font-normal leading-normal transition-all">
<option disabled="" selected="" value="">Sélectionnez le motif</option>
<option value="occupied">Place occupée par un autre véhicule</option>
<option value="non_compliant">Parking non conforme à la description</option>
<option value="access">Problème d'accès / Code invalide</option>
<option value="damage">Véhicule endommagé</option>
<option value="other">Autre problème</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 dark:text-primary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Description Field -->
<div class="flex flex-col gap-2">
<label class="text-[#111811] dark:text-white text-base font-semibold leading-normal ml-1">Description du problème</label>
<textarea class="flex w-full min-w-0 resize-none rounded-xl text-[#111811] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a2e1a] min-h-36 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal transition-all" placeholder="Expliquez la situation en détail (ex: La barrière ne s'ouvre pas, la place numéro 42 est prise...)"></textarea>
</div>
<!-- Photos Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between px-1">
<h4 class="text-[#111811] dark:text-white text-base font-semibold leading-normal tracking-[0.015em]">Preuves (Photos)</h4>
<span class="text-xs text-gray-500 dark:text-gray-400 font-medium bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-full">Optionnel</span>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Existing Photo Preview -->
<div class="relative group aspect-square rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700">
<div class="w-full h-full bg-cover bg-center" data-alt="Photo showing a car parked incorrectly in a parking spot" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAHyd3KwBmrIgRXO1G2aVx8dx5-vbnwUrQ3LsbQi8EST4m2ZY0q40FuZzh7VSn8hjXgL_iMaJXDl5SwRHLXoC00ZmMSZ1J1K4Sn_OuzhqGzdR5zMXGpYZ3wQvcnn1A1nyhPcSj1LIgdoWaI-4BGGsP7v5QU_atVky0TXLO2Hjeg3nX68pQ0T7k4VNfmljBRVzXXHExnkzdXg37M2QwRQxSJ5SvlptZEX4zSkL6qhZ-VZRH8P3pUQbUGi_-fJdrJIMd1FBi5Xoi0yfQ");'></div>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white">delete</span>
</div>
</div>
<!-- Add Photo Button -->
<button class="flex flex-col items-center justify-center gap-2 aspect-square rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#1a2e1a]/50 hover:bg-gray-100 dark:hover:bg-[#1a2e1a] hover:border-primary dark:hover:border-primary transition-all group">
<div class="p-2 rounded-full bg-white dark:bg-gray-800 shadow-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">add_a_photo</span>
</div>
<span class="text-xs font-medium text-gray-500 dark:text-gray-400">Ajouter</span>
</button>
<!-- Empty Slot Placeholder (Optional visual balance) -->
<div class="aspect-square rounded-xl border border-transparent bg-transparent"></div>
</div>
</div>
</main>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-[#102210]/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 z-40">
<button class="w-full h-14 flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 active:scale-[0.98] rounded-xl text-[#102210] font-bold text-lg shadow-lg shadow-primary/20 transition-all">
<span>Soumettre le litige</span>
<span class="material-symbols-outlined" style="font-size: 20px; font-weight: 600;">send</span>
</button>
</div>
</div>
</body></html>
