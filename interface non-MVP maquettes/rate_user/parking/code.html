<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rate Parking</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec13",
              "background-light": "#f6f8f6",
              "background-dark": "#102210",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Custom scrollbar hide for cleaner mobile look if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#111811] dark:text-white font-display overflow-x-hidden antialiased">
<div class="relative flex flex-col min-h-screen w-full max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl overflow-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-b border-gray-200/50 dark:border-gray-800/50 px-4 py-3">
<div class="flex items-center justify-between">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#111811] dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h2 class="text-[#111811] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Laisser un avis</h2>
</div>
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto pb-24">
<!-- ProfileHeader (Modified for Parking Context) -->
<div class="flex flex-col items-center pt-8 pb-6 px-6">
<div class="relative group cursor-pointer">
<div class="bg-center bg-no-repeat bg-cover rounded-2xl shadow-lg w-28 h-28 mb-5 ring-4 ring-white dark:ring-gray-800" data-alt="Modern parking spot entrance with greenery" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCLDF1xOLFFwkgWnyCphMRX_6lhBIWoJ0GmydgiUOfctW1XTq5WCtTq8n-zaTsQkcEqfBRnhmZ1wxmcA1C683BaClAqUDgasxWqyIyVgrQrQ4ixXsrZF6NpBgoGo4DDAupim1PhHHwsezPhRhcroynPQV_uEatJmtxrDEmXwzUALSvGdN0WcRGanSnMD5t1Trq1maDvXMqtCjqiI4qTvb7CjYOUSkFSXMkPfHzDN7c_XmVMWjoo10xF1hYVK7KHGPo1YMSOrW7AYac");'>
</div>
<div class="absolute -bottom-2 -right-2 bg-primary text-black rounded-full p-1.5 border-4 border-background-light dark:border-background-dark">
<span class="material-symbols-outlined block" style="font-size: 16px;">check</span>
</div>
</div>
<div class="flex flex-col items-center justify-center space-y-1">
<h3 class="text-[#111811] dark:text-white text-2xl font-bold leading-tight tracking-tight text-center">Parking Rue de la Paix</h3>
<p class="text-[#618961] dark:text-green-400/80 text-sm font-medium leading-normal text-center bg-primary/10 px-3 py-1 rounded-full">Réservation du 12 Oct</p>
</div>
</div>
<!-- Rating Section -->
<div class="px-4 py-2">
<h2 class="text-[#111811] dark:text-white tracking-tight text-xl font-bold leading-tight text-center mb-4">Comment évaluez-vous votre expérience ?</h2>
<!-- Interactive Star Rating -->
<div class="flex justify-center items-center gap-3 mb-6">
<button class="transition-transform active:scale-90 focus:outline-none group">
<span class="material-symbols-outlined text-primary text-5xl fill-1 transition-colors">star</span>
</button>
<button class="transition-transform active:scale-90 focus:outline-none group">
<span class="material-symbols-outlined text-primary text-5xl fill-1 transition-colors">star</span>
</button>
<button class="transition-transform active:scale-90 focus:outline-none group">
<span class="material-symbols-outlined text-primary text-5xl fill-1 transition-colors">star</span>
</button>
<button class="transition-transform active:scale-90 focus:outline-none group">
<span class="material-symbols-outlined text-primary text-5xl fill-1 transition-colors">star</span>
</button>
<button class="transition-transform active:scale-90 focus:outline-none group">
<span class="material-symbols-outlined text-gray-300 dark:text-gray-600 text-5xl fill-0 hover:text-primary transition-colors">star</span>
</button>
</div>
</div>
<div class="h-px bg-gray-100 dark:bg-gray-800 mx-6 mb-6"></div>
<!-- Criteria Tags -->
<div class="px-6 mb-6">
<p class="text-[#111811] dark:text-gray-200 text-base font-semibold leading-normal pb-3">Qu'est-ce qui était bien ?</p>
<div class="flex flex-wrap gap-3">
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-primary/50 bg-primary/10 text-black dark:text-green-100 text-sm font-medium transition-colors">
<span class="material-symbols-outlined text-base">cleaning_services</span>
                        Propreté
                    </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-sm font-medium hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-base">map</span>
                        Précision
                    </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-sm font-medium hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-base">chat</span>
                        Communication
                    </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-primary/50 bg-primary/10 text-black dark:text-green-100 text-sm font-medium transition-colors">
<span class="material-symbols-outlined text-base">security</span>
                        Sécurité
                    </button>
</div>
</div>
<!-- Comment Input -->
<div class="px-6 pb-6">
<label class="text-[#111811] dark:text-gray-200 text-base font-semibold leading-normal pb-2 block" for="comment">Commentaire</label>
<div class="relative">
<textarea class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 text-base text-[#111811] dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none transition-shadow shadow-sm" id="comment" placeholder="Dites-nous en plus sur votre expérience..." rows="4"></textarea>
<div class="absolute bottom-3 right-3 pointer-events-none">
<span class="material-symbols-outlined text-gray-300 dark:text-gray-600">edit</span>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light dark:bg-background-dark border-t border-gray-100 dark:border-gray-800 z-40 max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-[#0fdc0f] text-[#052e05] font-bold text-lg h-14 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span>Soumettre l'avis</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
</body></html>
