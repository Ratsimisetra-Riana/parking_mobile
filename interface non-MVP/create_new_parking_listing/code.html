</button>

</div>

<div class="absolute inset-0 bg-cover bg-center" data-alt="Parking entrance gate view" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCHGIy3vl9UwLbchChdDlPi2NkoHCanqBqWW9XUPb6mFQGUw4msAu3oq1DNg0vFzXZBIp1sg5PdqPiGB_UwPEQ45f_Vg8EsQWdEBU_upMMSgapXhRqgOPRUySPaXsbq9CyOZLCPrfuMnsh3vNF6oxrrHapfzuT9Eib_F37cUB5MM5mVGsgfGRvvFR3t351kCRxZAxwB8CaHmW1gqsBP0JAk9QuNQlLgalM5Azq13B95944r4nn5v0kO5cmzIgKElSWP7F9CJJ8EIYU");'></div>

<div class="h-2 bg-transparent"></div>

<div class="flex flex-col px-4 pt-4 gap-4">

<!-- Address Input -->
<div class="relative">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 ml-1 uppercase tracking-wider">Adresse</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-gray-400 z-10" style="font-size: 20px;">location_on</span>
<input class="w-full bg-surface-light dark:bg-surface-dark pl-10 pr-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm text-base" placeholder="12 Rue de la Paix, Paris" type="text"/>
<button class="absolute right-3 text-primary font-medium text-sm">Carte</button>
</div>
</div>
<!-- Map Preview (Static) -->

<div class="absolute inset-0 bg-black/5 flex items-center justify-center">
<div class="bg-surface-light dark:bg-surface-dark p-2 rounded-full shadow-lg text-primary animate-bounce">
<span class="material-symbols-outlined block" style="font-size: 24px;">my_location</span>
</div>
</div>
</div>
<!-- Description Input -->
<div class="relative mt-2">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 ml-1 uppercase tracking-wider">Description</label>
<textarea class="w-full bg-surface-light dark:bg-surface-dark px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm text-base resize-none" placeholder="Décrivez votre place (accès, sécurité, etc.)" rows="3"></textarea>
</div>
</div>
<div class="h-6 bg-transparent"></div>
<!-- Vehicle Types Section -->
<div class="flex flex-col px-4 gap-3">
<h2 class="text-[#111811] dark:text-white tracking-light text-xl font-bold leading-tight">Véhicules acceptés</h2>
<div class="flex flex-wrap gap-3">
<!-- Active Chip -->
<button class="flex items-center gap-2 px-4 py-2.5 bg-primary text-[#102210] rounded-lg font-medium shadow-sm ring-1 ring-primary/50 transition-all">
<span class="material-symbols-outlined" style="font-size: 20px;">directions_car</span>
                        Voiture
                    </button>
<!-- Inactive Chip -->
<button class="flex items-center gap-2 px-4 py-2.5 bg-surface-light dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 rounded-lg font-medium shadow-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
<span class="material-symbols-outlined" style="font-size: 20px;">two_wheeler</span>
                        Moto
                    </button>
<!-- Inactive Chip -->
<button class="flex items-center gap-2 px-4 py-2.5 bg-surface-light dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 rounded-lg font-medium shadow-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
<span class="material-symbols-outlined" style="font-size: 20px;">local_shipping</span>
                        Utilitaire
                    </button>
</div>
</div>
<div class="h-6 bg-transparent"></div>

<div class="flex flex-col px-4 gap-4">
<h2 class="text-[#111811] dark:text-white tracking-light text-xl font-bold leading-tight">Offre</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Price Input -->
<div class="col-span-1">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 ml-1 uppercase tracking-wider">Tarif Horaire</label>

<span class="material-symbols-outlined absolute right-3 text-gray-400 pointer-events-none" style="font-size: 18px;">euro_symbol</span>
</div>
</div>
<!-- Minimum Duration (Optional addition for context) -->
<div class="col-span-1">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 ml-1 uppercase tracking-wider">Min. Durée</label>
<div class="relative flex items-center">
<select class="w-full bg-surface-light dark:bg-surface-dark pl-3 pr-8 py-3 rounded-xl border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-base shadow-sm appearance-none">
<option>1h</option>
<option>2h</option>
<option>4h</option>
<option>Journée</option>
</select>
<span class="material-symbols-outlined absolute right-3 text-gray-400 pointer-events-none" style="font-size: 20px;">expand_more</span>
</div>
</div>
</div>
<!-- Availability Toggle -->
<div class="mt-2 bg-surface-light dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-gray-700 p-1 flex relative">
<button class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg bg-primary text-[#102210] font-semibold text-sm shadow-sm transition-all">
<span class="material-symbols-outlined" style="font-size: 18px;">update</span>
                        Récurrent
                    </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-gray-500 dark:text-gray-400 font-medium text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
<span class="material-symbols-outlined" style="font-size: 18px;">calendar_month</span>
                        Calendrier
                    </button>
</div>
<!-- Recurrence Options (Visible because Recurring is active) -->
<div class="flex flex-col gap-2 mt-1">
<div class="flex items-center justify-between p-3 bg-surface-light dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-gray-700">

</div>
<div class="flex items-center justify-between p-3 bg-surface-light dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-gray-700 opacity-60">

</div>
</div>
