<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Upload Parking Photos</title>
<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111811] dark:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800">
<button class="text-[#111811] dark:text-white flex size-12 shrink-0 items-center justify-start hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios</span>
</button>
<h2 class="text-[#111811] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
                Photos du parking
            </h2>
</div>
<!-- BodyText: Instructions -->
<div class="flex flex-col bg-background-light dark:bg-background-dark">
<p class="text-[#111811] dark:text-gray-300 text-sm font-normal leading-relaxed pb-3 pt-4 px-6 text-center">
                Ajoutez au moins 3 photos pour augmenter vos chances de location. La première photo sera la <span class="font-bold text-primary dark:text-[#13ec13]">photo principale</span>.
            </p>
</div>
<!-- ActionsBar: Quick Actions -->
<div class="@container mb-4">
<div class="gap-4 px-4 flex flex-wrap justify-center sm:justify-start">
<!-- Take Photo Action -->
<button class="flex flex-1 sm:flex-none flex-col items-center gap-2 bg-white dark:bg-[#1a2e1a] py-3 px-2 rounded-xl text-center shadow-sm border border-gray-100 dark:border-gray-800 active:scale-95 transition-transform">
<div class="rounded-full bg-[#f0f4f0] dark:bg-[#2a402a] p-3 flex items-center justify-center">
<span class="material-symbols-outlined text-[#111811] dark:text-white" style="font-size: 24px;">photo_camera</span>
</div>
<p class="text-[#111811] dark:text-white text-xs font-medium leading-normal">Prendre une photo</p>
</button>
<!-- Gallery Action -->
<button class="flex flex-1 sm:flex-none flex-col items-center gap-2 bg-white dark:bg-[#1a2e1a] py-3 px-2 rounded-xl text-center shadow-sm border border-gray-100 dark:border-gray-800 active:scale-95 transition-transform">
<div class="rounded-full bg-[#f0f4f0] dark:bg-[#2a402a] p-3 flex items-center justify-center">
<span class="material-symbols-outlined text-[#111811] dark:text-white" style="font-size: 24px;">image</span>
</div>
<p class="text-[#111811] dark:text-white text-xs font-medium leading-normal">Depuis la galerie</p>
</button>
</div>
</div>
<!-- ImageGrid: Photos -->
<div class="flex-1">
<div class="grid grid-cols-2 gap-3 p-4">
<!-- Photo 1: Main Photo -->
<div class="relative group aspect-square rounded-xl overflow-hidden shadow-sm border-2 border-primary">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-105" data-alt="Bright modern underground parking space with LED lights" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBX9tms_DZibkzvMpsHeNMf1724fDLXb6zbYgQx8T-WGm-7EpG6hLVb3j0U1PcgFp51lBmcjGr7kopAHuyG9rjT-MasCPQFxLGe_V706q-H12SD8MBv86hKUZ4TzA9fdEZ9MBqJn5IjzqawchzOBadhhlMoRvdLRaFzCchD82_yR9n__rZFqkTGMxsqx3V5_fhAzCGRduwG9UFPybCp7Gi-giPGkxMRycTBwsHBKR04L82h_RCOqItHqSrPsWeD9ekxDtHesrRm_qY");'>
</div>
<!-- Gradient overlay for text readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<!-- Main Badge -->
<div class="absolute bottom-3 left-3 bg-primary text-[#111811] text-[10px] uppercase font-bold px-2 py-1 rounded-md shadow-sm">
                        Principale
                    </div>
<!-- Delete Button -->
<button class="absolute top-2 right-2 bg-white/90 dark:bg-black/60 p-1.5 rounded-full backdrop-blur-sm text-red-500 hover:bg-red-50 transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
</button>
</div>
<!-- Photo 2 -->
<div class="relative group aspect-square rounded-xl overflow-hidden shadow-sm bg-white dark:bg-[#1a2e1a]">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-105" data-alt="Wide angle shot of parking entrance ramp" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD816iPnl6QRRKDUxsQXvVUgBuXvepiDUIcvQjBi0G7BiSHQUBPb5j5jZ9NcBA08xfx0A1wEZ4f5PMIGJLbX55fKydyk-VQuWCXrWb7NAvTclp-z2-d8XE3iKarcCwCyDLpEkKASY1lO-3gpTxxeZS4SjBTu8Re3cO130Oa8qBhyhimu-rK2BlMXxAohc28QUz7_uD0TEXApScq72LPpGqB1DTkqEgd3NoiTalbj03ECVqkeF-HKBqbZTLIYBt13X7mrxiqmnZXhkc");'>
</div>
<div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors"></div>
<!-- Delete Button -->
<button class="absolute top-2 right-2 bg-white/90 dark:bg-black/60 p-1.5 rounded-full backdrop-blur-sm text-red-500 hover:bg-red-50 transition-colors shadow-sm opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
</button>
<!-- Set as Main Action (Hover) -->
<button class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[90%] bg-white/90 dark:bg-black/70 text-[#111811] dark:text-white text-xs font-medium py-1.5 rounded-lg shadow-sm backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity">
                        Définir principale
                    </button>
</div>
<!-- Photo 3 -->
<div class="relative group aspect-square rounded-xl overflow-hidden shadow-sm bg-white dark:bg-[#1a2e1a]">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-105" data-alt="Detail view of numbered parking spot on concrete floor" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB6HOsxhZFWp_GZDkYdPfrPkrMqjlDbfoT7aDLItdpeuF1YKFTD29xWW6_PZGjTz9ND_lMB-69v1QI78nUP7MRm19Cro_PQHf4rm78Br1oEPQ7CQTzJUoKKD5Q7OBJF8Q0RVmD75fti-EnnFSuCv2PxC0hoy2iZ99Cjsc6oPR6KNXOO7SBQac5PKg9xvIOn5epTK35oS1DDZrTtGpnYubEzRYt4VFMHB_WRrrchChkMpzbyBIM-5mgs5lXioTJb4OWimDikoh1fqzM");'>
</div>
<div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors"></div>
<!-- Delete Button -->
<button class="absolute top-2 right-2 bg-white/90 dark:bg-black/60 p-1.5 rounded-full backdrop-blur-sm text-red-500 hover:bg-red-50 transition-colors shadow-sm opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
</button>
<!-- Set as Main Action (Hover) -->
<button class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[90%] bg-white/90 dark:bg-black/70 text-[#111811] dark:text-white text-xs font-medium py-1.5 rounded-lg shadow-sm backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity">
                        Définir principale
                    </button>
</div>
<!-- Add More Placeholder -->
<button class="flex flex-col items-center justify-center gap-2 aspect-square rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-600 bg-transparent hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<div class="rounded-full bg-gray-100 dark:bg-gray-800 p-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500" style="font-size: 24px;">add</span>
</div>
<span class="text-xs font-medium text-gray-400 dark:text-gray-500">Ajouter</span>
</button>
</div>
</div>
<!-- Bottom padding for scroll -->
<div class="h-24 bg-background-light dark:bg-background-dark"></div>
<!-- Sticky Footer Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-t border-gray-100 dark:border-gray-800 flex justify-center max-w-md mx-auto z-20">
<button class="w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 bg-primary hover:bg-[#0fdc0f] transition-colors text-[#111811] text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20">
<span class="truncate">Enregistrer les photos</span>
</button>
</div>
</div>
</body></html>
