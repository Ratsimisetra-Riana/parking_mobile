<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mot de passe oublié - Parking App</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ec13",
            "background-light": "#f6f8f6",
            "background-dark": "#102210",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    /* Custom utility for consistent sizing if needed */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-sm bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button class="text-[#111811] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<!-- Optional centered title based on plan, keeping it subtle -->
<h2 class="text-[#111811] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
        Réinitialisation
      </h2>
</div>
<!-- Main Content Wrapper -->
<div class="flex-1 flex flex-col px-6 pt-4">
<!-- Hero Illustration (Abstract lock/key concept) -->
<div class="flex justify-center py-8">
<div class="relative flex items-center justify-center size-24 bg-primary/20 rounded-full">
<span class="material-symbols-outlined text-primary text-[48px]">lock_reset</span>
</div>
</div>
<!-- HeadlineText -->
<h1 class="text-[#111811] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-3">
        Mot de passe oublié ?
      </h1>
<!-- BodyText -->
<p class="text-[#111811] dark:text-gray-300 text-base font-normal leading-normal pb-8 text-center px-2">
        Ne vous inquiétez pas, cela arrive. Veuillez entrer l'adresse associée à votre compte pour recevoir les instructions.
      </p>
<!-- TextField -->
<div class="flex flex-col gap-4 pb-4">
<label class="flex flex-col flex-1 group">
<p class="text-[#111811] dark:text-gray-200 text-sm font-medium leading-normal pb-2 ml-1">Adresse e-mail</p>
<div class="relative">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="form-input flex w-full resize-none overflow-hidden rounded-xl text-[#111811] dark:text-white border border-[#dbe6db] dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 pl-10 pr-4 text-base font-normal leading-normal transition-all duration-200" placeholder="exemple@email.com" type="email" value=""/>
</div>
</label>
</div>
<!-- Spacer to push button to bottom on small screens if needed, or just gap -->
<div class="flex-1"></div>
<!-- SingleButton -->
<div class="py-6 mt-auto">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 bg-primary hover:bg-green-400 text-[#111811] text-lg font-bold leading-normal tracking-[0.015em] transition-colors shadow-sm active:scale-[0.98]">
<span class="truncate">Envoyer le lien</span>
</button>
</div>
</div>
<!-- Bottom padding for iPhone home indicator area -->
<div class="h-6 w-full"></div>
</div>
</body></html>
